apiVersion: apps/v1
kind: Deployment

metadata:
  name: loan-default-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: loan-default-api

  template:
    metadata:
      labels:
        app: loan-default-api

    spec:
      imagePullSecrets:
        - name: artifact-registry-secret

      containers:
        - name: loan-default-api

          image: europe-west1-docker.pkg.dev/valid-design-385517/mlops-repo/loan-default-api:14c5b75cdaeb7eaf24dd5f6ecacffee88a919996

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: GCP_BUCKET_NAME
              value: "bigdata-mlop-bucket"