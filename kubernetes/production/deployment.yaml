apiVersion: apps/v1
kind: Deployment

metadata:
  name: loan-default-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: loan-default-api

  template:
    metadata:
      labels:
        app: loan-default-api

    spec:
      imagePullSecrets:
        - name: artifact-registry-secret

      containers:
        - name: loan-default-api

          image: europe-west1-docker.pkg.dev/valid-design-385517/mlops-repo/loan-default-api:0bf2ced6d8e5b1557790d5e50c3ce73dcad5e733

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: GCP_BUCKET_NAME
              value: "bigdata-mlop-bucket"