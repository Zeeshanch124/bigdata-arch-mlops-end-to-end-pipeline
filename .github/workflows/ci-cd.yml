name: CI-CD-Orchestrator

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: write

jobs:

  ci:
    uses: ./.github/workflows/ci.yml

  ingestion:
    needs: ci
    uses: ./.github/workflows/ingestion.yml
    secrets: inherit

  training:
    needs: ingestion
    uses: ./.github/workflows/training.yml
    secrets: inherit

  deploy:
    needs: training
    uses: ./.github/workflows/deploy.yml
    secrets: inherit