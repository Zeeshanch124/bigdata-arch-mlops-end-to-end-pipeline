name: Model Training Pipeline

on:
  workflow_call:
  
jobs:
  training:

    runs-on: ubuntu-latest

    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          gcp_sa_key: ${{ secrets.GCP_SA_KEY }}

      - name: Run Model Training
        run: |
          python src/models/train.py