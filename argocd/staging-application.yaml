apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loan-default-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Zeeshanch124/bigdata-arch-mlops-end-to-end-pipeline
    targetRevision: develop
    path: kubernetes/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true