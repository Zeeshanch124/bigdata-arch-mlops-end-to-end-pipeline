apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loan-default-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Zeeshanch124/bigdata-arch-mlops-end-to-end-pipeline
    targetRevision: feature/training-pipeline
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true